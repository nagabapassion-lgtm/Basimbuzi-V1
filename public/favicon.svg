<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <!-- Elegant Gold Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.9" />
  <!-- Center Shield -->
  <path d="M32 11 L47 17 C47 31 40 43 32 49 C24 43 17 31 17 17 Z" fill="#172554" fill-opacity="0.4" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round" />
  <!-- Monogram SB -->
  <text x="32" y="34.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5" filter="url(#shadow)">SB</text>
  <!-- Verified Golden Star Seal -->
  <polygon points="32,15 33.3,18 36.5,18.3 34,20.4 34.8,23.5 32,21.8 29.2,23.5 30,20.4 27.5,18.3 30.7,18" fill="url(#gold)" />
</svg>
