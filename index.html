    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SC Basimbuzi Receipt Management System",
      "alternateName": "SC Basimbuzi Receipts",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Digital payment and receipt management system for SC Basimbuzi with Google Sheets database, atomic receipt numbering, and automated email receipts.",

      "image": "https://scbasimbuzi-v2.ai.studio/logo.png",
      "author": {
        "@type": "Organization",
        "name": "SC Basimbuzi",
        "logo": "https://scbasimbuzi-v2.ai.studio/logo.png"
      }
    }
    </script>

    <!-- Runtime OpenGraph & Favicon sync script for custom domain support -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var savedSettings = localStorage.getItem('scb_local_settings_v3');
          var domain = '';
          if (savedSettings) {
            try {
              var s = JSON.parse(savedSettings);
              if (s && s.customDomain && s.customDomain.trim()) {
                domain = s.customDomain.trim();
              }
            } catch (e) {}
          }
          if (!domain) {
            domain = 'https://scbasimbuzi-v2.ai.studio';
          }
          if (!/^https?:\/\//i.test(domain)) {
            domain = 'https://' + domain;
          }
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', domain);
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', domain + '/logo.png');
          var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogSecImg) ogSecImg.setAttribute('content', domain + '/logo.png');
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', domain + '/logo.png');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
